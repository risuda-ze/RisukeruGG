packages:
  - '.'
  - 'functions'

overrides:
  postcss: 8.5.15
  serialize-javascript: 7.0.5
  qs: 6.15.2
  uuid: 11.1.1
  # @grpc/grpc-js <1.14.4 の脆弱性対応。firestore は ~1.9.0 固定のためバックポート版 1.9.16 を、
  # google-gax は ^1.10.9 のため 1.14.4 をそれぞれパッチ範囲内で強制適用する。
  '@grpc/grpc-js@~1.9.0': 1.9.16
  '@grpc/grpc-js@>=1.10.0 <1.14.4': 1.14.4
  # Dependabot alert 対応（トランジティブ依存の脆弱性修正）
  vite: '>=8.0.16'
  protobufjs: '>=7.6.3 <8'
  form-data: '>=2.5.6'
  undici: '>=7.28.0'
  '@babel/core': '>=7.29.6'
  js-yaml: '>=4.2.0 <5'

allowBuilds:
  sharp: true
  unrs-resolver: true
  '@firebase/util': true
  protobufjs: true
